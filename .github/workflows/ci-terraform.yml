name: CI de Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directorio:
          - terraform/global
          - terraform/environments/dev
          - terraform/environments/stage
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.2

      - name: Formato
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.directorio }}

      - name: Inicializar sin backend
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.directorio }}

      - name: Validar
        run: terraform validate
        working-directory: ${{ matrix.directorio }}

  tflint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.53.0

      - name: Ejecutar tflint
        run: |
          tflint --init
          tflint --recursive --format compact
        working-directory: terraform

  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Ejecutar Checkov
        run: |
          pip install checkov==3.4.3
          checkov -d terraform --framework terraform --compact --quiet
